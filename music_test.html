<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundCloud Player Test - Gianluca Volpe</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --glass-bg: rgba(20, 20, 20, 0.8); /* Trasparenza 80% */
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-color: #ff5500; 
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .hero {
            text-align: center;
            opacity: 0.3;
        }

        /* 1. Invitation Notification */
        #music-invite {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 12px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.4s ease;
            z-index: 1000;
            animation: slideIn 0.5s ease-out;
        }

        #music-invite:hover {
            transform: scale(1.05);
            border-color: var(--accent-color);
        }

        .invite-icon {
            font-size: 18px;
            background: var(--accent-color);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .invite-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
        }

        .start-btn {
            background: white;
            color: black;
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }

        /* 2. The Player Bar */
        #player-bar {
            position: fixed;
            bottom: 0; 
            left: 0;
            right: 0;
            height: 110px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            z-index: 1001;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
            transform: translateY(100%); 
        }

        #player-bar.active {
            transform: translateY(0);
        }

        /* Minimized state based on image reference */
        #player-bar.collapsed {
            transform: translateY(0);
            width: 60px;
            left: auto;
            right: 20px;
            bottom: 20px;
            height: 60px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--glass-bg);
        }

        #player-bar.collapsed:hover {
            transform: scale(1.1);
            background: rgba(30, 30, 30, 0.9);
        }

        .player-container {
            width: 100%;
            max-width: 1000px;
            position: relative;
            display: flex;
            align-items: center;
            transition: opacity 0.3s;
        }

        #player-bar.collapsed .player-container {
            opacity: 0;
            pointer-events: none;
        }

        .iframe-wrapper {
            width: 100%;
            height: 100px;
            border-radius: 12px;
            overflow: hidden;
            opacity: 0.8; 
        }

        .close-player {
            position: absolute;
            right: -40px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
        }

        /* Icon matching the provided image: Orange circle with white note */
        .collapsed-icon {
            display: none;
            width: 38px;
            height: 38px;
            background-color: var(--accent-color);
            border-radius: 50%;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #player-bar.collapsed .collapsed-icon {
            display: flex;
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 600px) {
            #player-bar {
                height: 130px;
                padding: 0 10px;
            }
            #player-bar.collapsed {
                right: 10px;
                bottom: 10px;
            }
            .close-player {
                right: 10px;
                top: 10px;
            }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Gianluca Volpe CV</h1>
        <p>Testing the an-invasive music player...</p>
    </div>

    <div id="music-invite" onclick="startMusic()">
        <div class="invite-icon">🎵</div>
        <div class="invite-text">Want to listen to my music?</div>
        <button class="start-btn">START</button>
    </div>

    <div id="player-bar" onclick="expandPlayer()">
        <div class="collapsed-icon">🎵</div>
        <div class="player-container">
            <div class="iframe-wrapper">
                <iframe 
                    width="100%" 
                    height="100%" 
                    scrolling="no" 
                    frameborder="no" 
                    allow="autoplay" 
                    src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/users/1063326143&color=000000&autoplay=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_artwork=true">
                </iframe>
            </div>
            <button class="close-player" onclick="event.stopPropagation(); closeMusic()">✕</button>
        </div>
    </div>

    <script>
        let collapseTimer;

        function startMusic() {
            document.getElementById('music-invite').style.display = 'none';
            const player = document.getElementById('player-bar');
            player.classList.add('active');
            player.classList.remove('collapsed');
            resetTimer();
        }

        function expandPlayer() {
            const player = document.getElementById('player-bar');
            if(player.classList.contains('collapsed')) {
                player.classList.remove('collapsed');
                resetTimer();
            }
        }

        function resetTimer() {
            clearTimeout(collapseTimer);
            collapseTimer = setTimeout(() => {
                collapsePlayer();
            }, 10000); 
        }

        function collapsePlayer() {
            const player = document.getElementById('player-bar');
            player.classList.add('collapsed');
        }

        function closeMusic() {
            const player = document.getElementById('player-bar');
            player.classList.remove('active');
            player.classList.remove('collapsed');
            clearTimeout(collapseTimer);
            setTimeout(() => {
                document.getElementById('music-invite').style.display = 'flex';
            }, 1000);
        }

        document.querySelector('.player-container').addEventListener('mousedown', resetTimer);
    </script>
</body>
</html>
